name: 2BR price check
on:
  schedule:
    # 6am / 10am / 2pm / 6pm / 10pm Central, skipping 2am. Tuned for CDT (UTC-5);
    # drifts ~1hr earlier during CST (Nov-Mar) since GitHub cron is UTC-only, no DST awareness.
    - cron: "0 3,11,15,19,23 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/monitor.yml", "aptmon.zip"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: aptmon, cancel-in-progress: false}
env:
  APTMON_HOME: .aptmon
  APTMON_DB_PATH: data/aptmon.db
  APTMON_TZ: America/Chicago
  APTMON_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'aptmon-S3PWILa96x3F' }}
  APTMON_DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack code (when uploaded as aptmon.zip)
        run: |
          if [ ! -f pyproject.toml ] && [ -f aptmon.zip ]; then
            unzip -qo aptmon.zip -d /tmp/src
            tar -C /tmp/src/aptmon --exclude=./.github --exclude=./data -cf - . | tar -xf -
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - name: Scrape, record, alert
        id: scrape
        run: python -m aptmon run --debug || echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: Save price history
        run: |
          git config user.name aptmon-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/aptmon.db
          git commit -m "price check $(TZ=America/Chicago date +'%F %H:%M')" || true
          git push
      - if: steps.scrape.outputs.failed == 'true'
        uses: actions/upload-artifact@v4
        with: {name: scrape-debug, path: .aptmon/debug, retention-days: 7}
      - run: python -m aptmon export-site site
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
